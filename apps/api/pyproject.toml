[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shop-api"
version = "0.1.0"
description = "FastAPI backend for an online shopping application"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.15,<2",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.8,<3",
    "psycopg[binary]>=3.2,<4",
    "PyJWT[crypto]>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "httpx2>=2.16.0",
    "pytest>=8.3,<9",
    "pytest-cov>=7.1.0",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shop_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["postgres: integration tests requiring a dedicated PostgreSQL test database"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 95

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
