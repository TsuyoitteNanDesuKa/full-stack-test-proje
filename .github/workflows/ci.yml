name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        id: dependencies
        working-directory: apps/api
        run: uv sync --locked

      - name: Ruff lint
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: apps/api
        run: uv run ruff check .

      - name: Ruff format check
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: apps/api
        run: uv run ruff format --check .

      - name: Verify OpenAPI snapshot
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: apps/api
        run: uv run python scripts/openapi_contract.py --check

      - name: Run backend tests with coverage
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: apps/api
        run: |
          mkdir -p reports
          uv run pytest \
            --cov=shop_api \
            --cov-report=term-missing \
            --cov-report=json:reports/backend-coverage.json \
            --cov-report=html:reports/backend-coverage-html \
            --junitxml=reports/backend-junit.xml

      - name: Upload backend reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: apps/api/reports/
          if-no-files-found: ignore
          retention-days: 14

  postgres:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shop_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shop_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SHOP_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/shop_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        id: dependencies
        working-directory: apps/api
        run: uv sync --locked

      - name: Run PostgreSQL migrations and integration tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: apps/api
        run: |
          mkdir -p reports
          uv run pytest \
            -m postgres \
            tests/test_cart_postgres.py \
            --junitxml=reports/postgres-junit.xml

      - name: Upload PostgreSQL reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: postgres-reports
          path: apps/api/reports/postgres-junit.xml
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend tests and quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        id: dependencies
        working-directory: apps/web
        run: npm ci

      - name: Oxlint
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: apps/web
        run: npm run lint

      - name: TypeScript check and production build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: apps/web
        run: npm run build

      - name: Verify frontend OpenAPI contract
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: apps/web
        run: npm run contract:check

      - name: Run frontend tests with coverage
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: apps/web
        run: |
          mkdir -p test-results
          npm run test:coverage -- \
            --reporter=default \
            --reporter=junit \
            --outputFile=test-results/frontend-junit.xml

      - name: Upload frontend reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-reports
          path: |
            apps/web/test-results/
            apps/web/coverage/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: Browser end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install frontend dependencies
        id: frontend-dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install backend dependencies
        id: backend-dependencies
        if: ${{ !cancelled() && steps.frontend-dependencies.outcome == 'success' }}
        working-directory: apps/api
        run: uv sync --locked

      - name: Install Chromium and system dependencies
        id: browser
        if: ${{ !cancelled() && steps.backend-dependencies.outcome == 'success' }}
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        working-directory: apps/web
        run: npm run test:e2e:smoke

      - name: Upload Playwright report and traces
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  keycloak-e2e:
    name: Comprehensive Keycloak E2E
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install frontend dependencies
        id: frontend-dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install backend dependencies
        id: backend-dependencies
        if: ${{ !cancelled() && steps.frontend-dependencies.outcome == 'success' }}
        working-directory: apps/api
        run: uv sync --locked

      - name: Install Chromium and system dependencies
        id: browser
        if: ${{ !cancelled() && steps.backend-dependencies.outcome == 'success' }}
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Start isolated Keycloak test realm
        id: keycloak-service
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        env:
          KEYCLOAK_ADMIN_USERNAME: admin
          KEYCLOAK_ADMIN_PASSWORD: qa-020-ephemeral-ci-only
        run: |
          docker compose up -d keycloak
          for attempt in {1..60}; do
            if curl --fail --silent \
              http://localhost:8080/realms/shop/.well-known/openid-configuration \
              > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs keycloak
          echo "Keycloak test realm did not become ready."
          exit 1

      - name: Configure ephemeral seller-role provisioner
        id: configure-keycloak
        if: ${{ !cancelled() && steps.keycloak-service.outcome == 'success' }}
        working-directory: apps/web
        env:
          E2E_KEYCLOAK_ADMIN_USERNAME: admin
          E2E_KEYCLOAK_ADMIN_PASSWORD: qa-020-ephemeral-ci-only
        run: node e2e/configure-ci-keycloak.mjs

      - name: Run Keycloak browser tests
        if: ${{ !cancelled() && steps.configure-keycloak.outcome == 'success' }}
        working-directory: apps/web
        env:
          CI: "true"
          E2E_KEYCLOAK_E2E: "1"
          E2E_KEYCLOAK_ADMIN_USERNAME: admin
          E2E_KEYCLOAK_ADMIN_PASSWORD: qa-020-ephemeral-ci-only
        run: npm run test:e2e:keycloak

      - name: Upload Keycloak E2E report and traces
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-e2e-reports
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  report:
    name: Unified test report
    if: ${{ always() }}
    needs:
      - backend
      - postgres
      - frontend
      - e2e
      - keycloak-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test unified reporting
        run: node --test scripts/ci-summary.test.mjs

      - name: Download backend reports
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: backend-reports
          path: artifacts/backend

      - name: Download frontend reports
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: frontend-reports
          path: artifacts/frontend

      - name: Download PostgreSQL reports
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: postgres-reports
          path: artifacts/postgres

      - name: Download browser test reports
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: e2e-reports
          path: artifacts/e2e

      - name: Download Keycloak browser test reports
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: keycloak-e2e-reports
          path: artifacts/keycloak-e2e

      - name: Write unified workflow summary
        if: ${{ always() }}
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          KEYCLOAK_E2E_RESULT: ${{ needs.keycloak-e2e.result }}
          KEYCLOAK_E2E_REQUIRED: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: node scripts/ci-summary.mjs

      - name: Fail the workflow if any quality stage failed
        if: ${{ always() }}
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          KEYCLOAK_E2E_RESULT: ${{ needs.keycloak-e2e.result }}
          KEYCLOAK_E2E_REQUIRED: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ "$BACKEND_RESULT" != "success" || \
                "$POSTGRES_RESULT" != "success" || \
                "$FRONTEND_RESULT" != "success" || \
                "$E2E_RESULT" != "success" ]]; then
            echo "At least one quality stage did not pass."
            exit 1
          fi
          if [[ "$KEYCLOAK_E2E_REQUIRED" == "true" && \
                "$KEYCLOAK_E2E_RESULT" != "success" ]]; then
            echo "The required comprehensive Keycloak E2E stage did not pass."
            exit 1
          fi
